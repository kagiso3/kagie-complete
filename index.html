<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kagie | Launch</title>
  <script src="js/backend.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f7fb;--text:#10203a;--muted:#5f718c;--red:#c90000;--blue:#2fa4ff;--yellow:#f5c84c;--glass:rgba(255,255,255,.82);--shadow:0 30px 60px rgba(15,23,42,.14)}
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:"Roboto",system-ui,sans-serif;color:var(--text);
      background:
        radial-gradient(900px 520px at 15% 0%, rgba(47,164,255,.16), transparent 60%),
        radial-gradient(900px 560px at 85% 10%, rgba(245,200,76,.18), transparent 60%),
        radial-gradient(900px 520px at 50% 100%, rgba(201,0,0,.08), transparent 60%),
        var(--bg)
    }
    .shell{
      width:min(460px,100%);
      padding:34px 26px 28px;
      border-radius:34px;
      background:var(--glass);
      border:1px solid rgba(255,255,255,.72);
      box-shadow:var(--shadow);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      text-align:center
    }
    .logo{
      width:106px;height:106px;margin:0 auto 22px;border-radius:28px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--red),var(--blue));color:#fff;font:900 52px "Poppins",sans-serif;box-shadow:0 22px 40px rgba(15,23,42,.16)
    }
    h1{margin:0;font:900 46px "Poppins",sans-serif;line-height:1}
    p{margin:14px auto 0;max-width:320px;color:var(--muted);font-size:15px;line-height:1.7}
    .loader{width:80px;height:80px;margin:26px auto 20px;border-radius:50%;border:6px solid rgba(47,164,255,.12);border-top-color:var(--blue);border-right-color:var(--red);animation:spin 1.1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
    .notice{margin-top:18px;padding:14px;border-radius:18px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.9);font-size:13px;line-height:1.7}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
    .btn{border:none;border-radius:16px;padding:13px 16px;text-decoration:none;font:800 14px "Roboto",sans-serif;display:inline-flex;align-items:center;justify-content:center}
    .primary{background:linear-gradient(135deg,var(--red),#ef4444);color:#fff}
    .secondary{background:#fff;color:var(--text);box-shadow:0 10px 18px rgba(15,23,42,.08)}
  </style>
</head>
<body>
  <main class="shell">
    <div class="logo">K</div>
    <h1>Kagie</h1>
    <p>South African tertiary application support, one profile, one dashboard, one guided path to many institutions.</p>
    <div class="loader" aria-hidden="true"></div>
    <div class="status" id="statusText">Preparing your Kagie workspace</div>
    <div class="notice">
      Demo staff accounts are ready for MVP testing.<br>
      Assistant: <strong>assistant@kagie.app</strong> / <strong>123456</strong><br>
      Master admin: <strong>admin@kagie.app</strong> / <strong>123456</strong>
    </div>
    <div class="actions">
      <a class="btn primary" href="signup.html">Create account</a>
      <a class="btn secondary" href="login.html">Login</a>
    </div>
  </main>

  <script>
    (() => {
      const api = window.KagieAPI;
      const statusText = document.getElementById("statusText");
      const current = api.currentUser();

      function routeByRole(user) {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        if (user.role === "master_admin") {
          window.location.href = "master-admin/dashboard.html";
          return;
        }
        if (user.role === "assistant_admin") {
          window.location.href = "assistant/dashboard.html";
          return;
        }
        window.location.href = "home.html";
      }

      if (current) {
        statusText.textContent = "Restoring your active session";
        setTimeout(() => routeByRole(current), 1200);
      } else {
        setTimeout(() => {
          statusText.textContent = "Redirecting to login";
          window.location.href = "login.html";
        }, 1800);
      }
    })();
  </script>
</body>
</html>
