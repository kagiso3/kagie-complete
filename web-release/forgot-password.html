<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kagie | Reset Password</title>
  <style>
    :root {
      --bg: #f5f8fc;
      --card: rgba(255, 255, 255, 0.94);
      --text: #10233d;
      --muted: #66788f;
      --red: #c24848;
      --red-strong: #db0f16;
      --blue: #1f8aea;
      --blue-2: #63b9ff;
      --line: #d8e4f0;
      --shadow: 0 22px 45px rgba(16, 35, 61, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 20% 0%, rgba(31, 138, 234, 0.14), transparent 60%),
        radial-gradient(900px 520px at 80% 8%, rgba(219, 15, 22, 0.08), transparent 60%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(460px, 100%);
      background: var(--card);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(31, 138, 234, 0.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button,
    a {
      height: 48px;
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    button {
      background: linear-gradient(135deg, var(--red-strong), var(--red));
      color: #fff;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    a {
      background: rgba(31, 138, 234, 0.1);
      color: var(--blue);
    }

    .message {
      min-height: 20px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .message.error { color: var(--red-strong); }
    .message.success { color: #1a6b4a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset Password</h1>
    <p>Enter your Kagie email address and we will send you a secure password reset link.</p>

    <form id="resetForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required />
      </div>

      <div class="actions">
        <button id="resetBtn" type="submit">Send Reset Link</button>
        <a href="login.html">Back to Login</a>
      </div>
    </form>

    <div class="message" id="message" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/backend.js?v=20260405k"></script>
<script src="js/supabase-config.js?v=20260405k"></script>
  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");
    let resetInFlight = false;

    function setMessage(text, type) {
      message.textContent = text;
      message.className = type ? `message ${type}` : "message";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (resetInFlight) return;
      setMessage("");

      const email = document.getElementById("email").value.trim().toLowerCase();
      if (!email) {
        setMessage("Enter your email address.", "error");
        return;
      }

      resetInFlight = true;
      resetBtn.disabled = true;
      resetBtn.textContent = "Sending...";

      try {
        await KagieAPI.requestPasswordReset(email, { redirectTo: "changepassword.html" });
        setMessage("Reset link sent. Check your email and open the Kagie link to choose a new password.", "success");
        form.reset();
      } catch (error) {
        console.error(error);
        setMessage(error.message || "Could not send the reset link.", "error");
      } finally {
        resetInFlight = false;
        resetBtn.disabled = false;
        resetBtn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
