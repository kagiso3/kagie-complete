<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kagie | Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-left:#ebe4e6;
      --bg-right:#e5e7eb;
      --card:rgba(248,248,249,.82);
      --text:#0f1836;
      --muted:#6f7e98;
      --line:#363636;
      --red1:#ff4d4d;
      --red2:#df0000;
      --shadow:0 28px 60px rgba(0,0,0,.10);
      --button-shadow:0 18px 32px rgba(223,0,0,.22);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:"Poppins",sans-serif;
      background:
        radial-gradient(circle at left top, rgba(255,255,255,.55), transparent 32%),
        linear-gradient(90deg,var(--bg-left) 0%, var(--bg-right) 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      overflow:auto;
    }

    .auth-card{
      width:100%;
      max-width:620px;
      background:var(--card);
      border-radius:34px;
      padding:40px 36px 34px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.65);
    }

    h1{
      margin:0;
      text-align:center;
      font-size:54px;
      line-height:.95;
      font-weight:900;
      color:var(--text);
      letter-spacing:-.03em;
    }

    .top-text{
      text-align:center;
      margin:14px 0 28px;
      color:var(--muted);
      font-size:16px;
    }

    .top-text a{
      color:#111827;
      text-decoration:none;
      font-weight:800;
    }

    .field{
      margin-bottom:22px;
      position:relative;
    }

    .input{
      width:100%;
      height:64px;
      border:2.5px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.2);
      padding:0 20px;
      font-size:16px;
      font-weight:700;
      outline:none;
      transition:.25s ease;
      font-family:inherit;
    }

    .input::placeholder{
      color:#777b87;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-weight:700;
    }

    .input:focus{
      border-color:#d00000;
      box-shadow:0 0 0 4px rgba(224,0,0,.08);
      transform:translateY(-1px);
    }

    .field-label{
      position:absolute;
      top:-10px;
      left:14px;
      background:rgba(250,250,251,.95);
      padding:0 8px;
      font-size:12px;
      letter-spacing:.24em;
      font-weight:800;
      color:#d00000;
      text-transform:uppercase;
    }

    .input-wrap{
      position:relative;
    }

    .toggle-pass{
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:transparent;
      cursor:pointer;
      font-weight:700;
      color:#6b7280;
      font-family:inherit;
    }

    .btn{
      width:100%;
      height:64px;
      border:none;
      border-radius:10px;
      background:linear-gradient(180deg,var(--red1),var(--red2));
      color:#fff;
      font-size:18px;
      font-weight:900;
      letter-spacing:.05em;
      cursor:pointer;
      box-shadow:var(--button-shadow);
      margin-top:8px;
      transition:.25s ease;
      font-family:inherit;
    }

    .btn:hover{transform:translateY(-2px)}
    .btn:disabled{opacity:.7;cursor:not-allowed;transform:none}

    .message{
      min-height:24px;
      text-align:center;
      font-size:14px;
      font-weight:600;
      margin-top:14px;
    }

    .message.error{color:#b00020}
    .message.success{color:#0f8a43}

    @media (max-width:700px){
      .auth-card{padding:32px 20px 26px}
      h1{font-size:42px}
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <h1>Create new<br>Account</h1>
    <p class="top-text">Already Registered? <a href="login.html">Log in here.</a></p>

    <form id="signupForm">
      <div class="field">
        <input class="input" id="fullName" type="text" placeholder="Name" required>
      </div>

      <div class="field">
        <input class="input" id="email" type="email" placeholder="Email" required>
      </div>

      <div class="field">
        <div class="input-wrap">
          <input class="input" id="password" type="password" placeholder="Password" required minlength="6">
          <button class="toggle-pass" type="button" id="togglePassword">Show</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Date of Birth</span>
        <input class="input" id="dob" type="text" inputmode="none" autocomplete="bday" placeholder="Day / Month / Year" data-dob-wheel data-min-age="13" required readonly>
      </div>

      <div class="field">
        <input class="input" id="schoolAttended" type="text" placeholder="High School" required>
      </div>

      <button class="btn" id="signupBtn" type="submit">SIGN UP</button>
      <div class="message" id="message"></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/backend.js?v=20260426a"></script>
<script src="js/supabase-config.js?v=20260405k"></script>
<script src="js/dob-wheel-picker.js?v=20260426a"></script>
  <script>
    const form = document.getElementById("signupForm");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const signupBtn = document.getElementById("signupBtn");
    const message = document.getElementById("message");
    let signupInFlight = false;

    function ensureApiReady() {
      if (window.KagieAPI) return window.KagieAPI;
      setMessage("Kagie is still loading on this page. Refresh once and try again.", "error");
      return null;
    }

    function formatSignupMessage(raw, fallback = "Signup failed.") {
      const text = String(raw || "").trim();
      if (!text) return fallback;
      if (/email.*confirm|email_not_confirmed/i.test(text)) {
        return "Check your email and confirm your Kagie account before first login.";
      }
      return text;
    }

    togglePassword.addEventListener("click", () => {
      const nextType = password.type === "password" ? "text" : "password";
      password.type = nextType;
      togglePassword.textContent = nextType === "password" ? "Show" : "Hide";
    });

    function setMessage(text, type = "") {
      message.textContent = text;
      message.className = type ? `message ${type}` : "message";
    }

    function normalizeDobInput(raw) {
      const dobField = document.getElementById("dob");
      const pickerValue = dobField?.dataset?.isoValue || "";
      const value = String(pickerValue || raw || "").trim();
      if (!value) return "";

      const picker = window.KagieDobWheel;
      if (picker?.validateValue) {
        const checked = picker.validateValue(value, { minAge: 13 });
        if (!checked.ok) throw new Error(checked.message);
        return checked.iso;
      }

      let year = "";
      let month = "";
      let day = "";
      let match = value.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);

      if (match) {
        year = match[1];
        month = match[2];
        day = match[3];
      } else {
        match = value.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
        if (match) {
          day = match[1];
          month = match[2];
          year = match[3];
        } else if (/^\d{8}$/.test(value)) {
          day = value.slice(0, 2);
          month = value.slice(2, 4);
          year = value.slice(4);
        } else {
          throw new Error("Use date of birth like DD/MM/YYYY or YYYY-MM-DD.");
        }
      }

      const iso = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const parsed = new Date(`${iso}T00:00:00`);
      if (Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== iso) {
        throw new Error("Enter a valid date of birth.");
      }
      const today = new Date();
      const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
      if (iso > todayKey) throw new Error("Date of birth cannot be in the future.");
      const minAgeDate = new Date(today.getFullYear() - 13, today.getMonth(), today.getDate());
      const minAgeKey = `${minAgeDate.getFullYear()}-${String(minAgeDate.getMonth() + 1).padStart(2, "0")}-${String(minAgeDate.getDate()).padStart(2, "0")}`;
      if (iso > minAgeKey) throw new Error("Learner must be at least 13 years old.");
      return iso;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (signupInFlight) return;
      setMessage("");
      const api = ensureApiReady();
      if (!api) return;

      signupInFlight = true;
      signupBtn.disabled = true;
      signupBtn.textContent = "Creating...";

      try {
        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const dob = normalizeDobInput(document.getElementById("dob").value);
        const schoolAttended = document.getElementById("schoolAttended").value.trim();

        if (!fullName || !email || !password.value) {
          throw new Error("Please fill all required fields");
        }

        await api.registerUser({
          fullName,
          email,
          password: password.value,
          dob,
          schoolName: schoolAttended
        });

        setMessage("Account created successfully. Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1000);
      } catch (err) {
        console.error("Signup error:", err);
        setMessage(formatSignupMessage(err.message, "Signup failed."), "error");
        signupInFlight = false;
        signupBtn.disabled = false;
        signupBtn.textContent = "SIGN UP";
      }
    });
  </script>
</body>
</html>
