<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kagie | Redirecting</title>
  <meta http-equiv="refresh" content="0; url=home.html" />
  <style>
    :root{
      --bg:#f5f8fc;
      --ink:#10233d;
      --muted:#66788f;
      --red:#c24848;
      --red-hero:#db0f16;
      --blue:#1f8aea;
      --line:#d8e4f0;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:Roboto,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top left, rgba(31,138,234,.14), transparent 28%),
        radial-gradient(circle at bottom right, rgba(219,15,22,.12), transparent 28%),
        var(--bg);
    }
    .card{
      width:min(420px,100%);
      background:rgba(255,255,255,.94);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:0 18px 34px rgba(16,35,61,.09);
      padding:28px 24px;
      text-align:center;
    }
    .badge{
      width:64px;
      height:64px;
      margin:0 auto 16px;
      border-radius:20px;
      display:grid;
      place-items:center;
      font-size:1.4rem;
      font-weight:900;
      color:#fff;
      background:linear-gradient(135deg,var(--red-hero),var(--blue));
    }
    h1{margin:0 0 8px;font-size:1.45rem;font-weight:900}
    p{margin:0 0 18px;color:var(--muted);line-height:1.6}
    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:0 18px;
      border-radius:16px;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      background:linear-gradient(135deg,var(--red-hero),var(--red));
      box-shadow:0 12px 22px rgba(219,15,22,.18);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">K</div>
    <h1>Opening Kagie Home</h1>
    <p>Your old learner dashboard link now routes into the main Kagie app home so everything stays in one place.</p>
    <a href="home.html">Continue</a>
  </div>
  <script>
    window.location.replace("home.html" + window.location.search + window.location.hash);
  </script>
</body>
</html>
