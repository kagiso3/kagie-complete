<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kagie | Change Password</title>
  <style>
    :root {
      --bg: #f5f8fc;
      --card: rgba(255, 255, 255, 0.94);
      --text: #10233d;
      --muted: #66788f;
      --red: #c24848;
      --red-strong: #db0f16;
      --blue: #1f8aea;
      --blue-2: #63b9ff;
      --line: #d8e4f0;
      --shadow: 0 22px 45px rgba(16, 35, 61, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 20% 0%, rgba(31, 138, 234, 0.14), transparent 60%),
        radial-gradient(900px 520px at 80% 8%, rgba(219, 15, 22, 0.08), transparent 60%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(460px, 100%);
      background: var(--card);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(31, 138, 234, 0.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button,
    a {
      height: 48px;
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    button {
      background: linear-gradient(135deg, var(--red-strong), var(--red));
      color: #fff;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    a {
      background: rgba(31, 138, 234, 0.1);
      color: var(--blue);
    }

    .message {
      min-height: 20px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .message.error { color: var(--red-strong); }
    .message.success { color: #1a6b4a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Choose a New Password</h1>
    <p id="pageCopy">Open this page from your Kagie password reset email, then enter your new password below.</p>

    <form id="changePasswordForm">
      <div class="field">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" minlength="4" required />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" minlength="4" required />
      </div>

      <div class="actions">
        <button id="saveBtn" type="submit">Save Password</button>
        <a href="login.html">Back to Login</a>
      </div>
    </form>

    <div class="message" id="message" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/backend.js?v=20260405k"></script>
<script src="js/supabase-config.js?v=20260405k"></script>
  <script>
    const form = document.getElementById("changePasswordForm");
    const message = document.getElementById("message");
    const pageCopy = document.getElementById("pageCopy");
    const saveBtn = document.getElementById("saveBtn");

    function setMessage(text, type) {
      message.textContent = text;
      message.className = type ? `message ${type}` : "message";
    }

    async function warmSession() {
      try {
        await KagieAPI.getSupabaseSession();
      } catch (error) {
        console.warn("Recovery session warm-up failed:", error);
      }

      try {
        const restored = await KagieAPI.restoreSession();
        if (restored) {
          pageCopy.textContent = "Your Kagie recovery session is ready. Choose a strong new password below.";
        }
      } catch (error) {
        console.warn("Session restore failed:", error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setMessage("");

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!newPassword || !confirmPassword) {
        setMessage("Complete every field.", "error");
        return;
      }

      if (newPassword.length < 4) {
        setMessage("New password must be at least 4 characters.", "error");
        return;
      }

      if (newPassword !== confirmPassword) {
        setMessage("New passwords do not match.", "error");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try {
        await KagieAPI.updateAuthenticatedPassword(newPassword);
        setMessage("Password updated successfully. Redirecting to login...", "success");
        form.reset();
        setTimeout(() => {
          window.location.href = "login.html?switch=1";
        }, 900);
      } catch (error) {
        console.error(error);
        setMessage(error.message || "Could not update your password.", "error");
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Password";
      }
    });

    warmSession();
  </script>
</body>
</html>
