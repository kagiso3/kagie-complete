<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kagie | Change Password</title>
  <script src="js/backend.js"></script>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: rgba(255, 255, 255, 0.9);
      --text: #0f172a;
      --muted: #64748b;
      --red: #c90000;
      --blue: #2fa4ff;
      --shadow: 0 22px 45px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 20% 0%, rgba(47, 164, 255, 0.14), transparent 60%),
        radial-gradient(900px 520px at 80% 8%, rgba(201, 0, 0, 0.08), transparent 60%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(460px, 100%);
      background: var(--card);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 14px;
      padding: 0 14px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(47, 164, 255, 0.12);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button,
    a {
      height: 48px;
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    button {
      background: linear-gradient(135deg, var(--red), #ef4444);
      color: #fff;
    }

    a {
      background: rgba(47, 164, 255, 0.1);
      color: var(--blue);
    }

    .message {
      min-height: 20px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .message.error { color: #b91c1c; }
    .message.success { color: #15803d; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Change Password</h1>
    <p>Update the password for your current Kagie session.</p>

    <form id="changePasswordForm">
      <div class="field">
        <label for="currentPassword">Current Password</label>
        <input id="currentPassword" type="password" required />
      </div>

      <div class="field">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" minlength="4" required />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" minlength="4" required />
      </div>

      <div class="actions">
        <button type="submit">Save Password</button>
        <a href="profile.html">Back to Profile</a>
      </div>
    </form>

    <div class="message" id="message" aria-live="polite"></div>
  </main>

  <script>
    const currentUser = window.KagieAPI?.currentUser?.();
    if (!currentUser) {
      window.location.href = "login.html";
    }

    const form = document.getElementById("changePasswordForm");
    const message = document.getElementById("message");

    function setMessage(text, type) {
      message.textContent = text;
      message.className = type ? `message ${type}` : "message";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      setMessage("");

      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!currentPassword || !newPassword || !confirmPassword) {
        setMessage("Complete every field.", "error");
        return;
      }

      if (newPassword.length < 4) {
        setMessage("New password must be at least 4 characters.", "error");
        return;
      }

      if (newPassword !== confirmPassword) {
        setMessage("New passwords do not match.", "error");
        return;
      }

      const users = JSON.parse(localStorage.getItem("kagie_users") || "[]");
      const index = users.findIndex((user) => user.id === currentUser.id);

      if (index === -1) {
        setMessage("Current account could not be found.", "error");
        return;
      }

      if (String(users[index].password || "") !== currentPassword) {
        setMessage("Current password is incorrect.", "error");
        return;
      }

      users[index].password = newPassword;
      users[index].updatedAt = new Date().toISOString();
      localStorage.setItem("kagie_users", JSON.stringify(users));

      const activeUser = { ...currentUser, password: newPassword };
      localStorage.setItem("kagie_current_user", JSON.stringify(activeUser));

      setMessage("Password updated successfully.", "success");
      form.reset();
    });
  </script>
</body>
</html>
