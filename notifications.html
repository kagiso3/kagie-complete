<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kagie | Notifications</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/backend.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/notifications-page.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f7fb;--text:#0f172a;--muted:#64748b;--line:rgba(15,23,42,.08);--card:rgba(255,255,255,.84);--red:#c90000;--blue:#2fa4ff;--yellow:#f5c84c;--orange:#e45a2a;--green:#13a35d;--shadow:0 20px 44px rgba(15,23,42,.12);--soft:0 10px 22px rgba(15,23,42,.08)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:"Roboto",system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 520px at 15% 0%,rgba(47,164,255,.14),transparent 60%),radial-gradient(900px 560px at 85% 10%,rgba(245,200,76,.16),transparent 60%),var(--bg)}.shell{width:min(860px,100%);margin:0 auto;display:grid;gap:16px}.top,.hero,.card{background:var(--card);border:1px solid rgba(255,255,255,.65);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
    .top{padding:18px 20px;background:linear-gradient(135deg,var(--red),#a70000);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand h1{margin:0;font:800 22px "Poppins",sans-serif}.brand p{margin:5px 0 0;font-size:13px;opacity:.92}.actions,.filters{display:flex;gap:10px;flex-wrap:wrap}.btn,.pill,.mini{border:none;border-radius:14px;font:700 14px inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:.18s ease}.btn{height:44px;padding:0 16px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:var(--soft)}.pill,.mini{padding:10px 14px;background:#fff;border:1px solid var(--line);color:var(--text)}.pill.active{background:rgba(47,164,255,.1);color:var(--blue);border-color:rgba(47,164,255,.2)}.btn:hover,.pill:hover,.mini:hover{transform:translateY(-2px)}
    .hero{padding:20px;background:linear-gradient(135deg,rgba(47,164,255,.96),rgba(201,0,0,.88));color:#fff}.hero h2{margin:0;font:800 30px "Poppins",sans-serif}.hero p{margin:8px 0 0;font-size:14px;line-height:1.6;color:rgba(255,255,255,.92)}.hero .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hero .meta span{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:800}
    .card{padding:18px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}.head h3{margin:0;font:800 18px "Poppins",sans-serif}.head p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.list{display:grid;gap:12px}.item{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 18px rgba(15,23,42,.04)}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.item strong{font-size:15px}.item p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.chip{padding:8px 12px;border-radius:999px;font-size:11px;font-weight:900;border:1px solid transparent;white-space:nowrap}.review{background:rgba(47,164,255,.12);color:var(--blue);border-color:rgba(47,164,255,.18)}.pending{background:rgba(245,200,76,.18);color:#8c6b00;border-color:rgba(245,200,76,.25)}.success{background:rgba(19,163,93,.12);color:var(--green);border-color:rgba(19,163,93,.18)}.default{background:rgba(228,90,42,.12);color:var(--orange);border-color:rgba(228,90,42,.16)}.danger{background:rgba(201,0,0,.12);color:var(--red);border-color:rgba(201,0,0,.16)}.item.unread{border-color:rgba(47,164,255,.22);box-shadow:0 12px 24px rgba(47,164,255,.08)}.item-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.mini{height:36px;padding:0 12px}.empty{text-align:center;color:var(--muted);padding:18px 12px;font-size:13px;font-weight:600}
    @media (max-width:640px){body{padding:12px}.btn{width:100%}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><h1>Notifications</h1><p>Your Kagie inbox for application, payment, document, and support updates.</p></div>
      <div class="actions"><a class="btn" href="home.html">Home</a><a class="btn" href="Dashboard.html">Dashboard</a></div>
    </header>
    <section class="hero">
      <h2 id="heroTitle">Stay updated</h2>
      <p id="heroText">We are loading your latest Kagie notifications.</p>
      <div class="meta"><span id="unreadMeta">0 unread</span><span id="totalMeta">0 total notifications</span></div>
    </section>
    <section class="card">
      <div class="head">
        <div><h3>Inbox</h3><p>Use filters to focus on unread or completed updates.</p></div>
        <div class="filters"><button class="pill active" data-filter="all">All</button><button class="pill" data-filter="unread">Unread</button><button class="pill" data-filter="read">Read</button><button class="pill" id="markAllBtn" type="button">Mark all read</button></div>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>
  <script>
    (()=>{if(window.KagieNotificationsPageLoaded)return;const api=window.KagieAPI,user=api.requireRole("user"),list=document.getElementById("list"),heroTitle=document.getElementById("heroTitle"),heroText=document.getElementById("heroText"),unreadMeta=document.getElementById("unreadMeta"),totalMeta=document.getElementById("totalMeta"),filters=[...document.querySelectorAll("[data-filter]")];let active="all";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const dt=v=>{if(!v)return"No date";const d=new Date(v);return Number.isNaN(d.getTime())?"No date":d.toLocaleString("en-ZA",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})};const route=item=>{const s=`${item.title||""} ${item.message||""}`.toLowerCase();if(s.includes("document"))return"upload.html";if(s.includes("payment")||s.includes("cart"))return"checkout.html";if(s.includes("assistant")||s.includes("support"))return"personal-assistance.html";if(s.includes("welcome"))return"home.html";return"Dashboard.html"};const cls=t=>{const v=String(t||"").toLowerCase();if(v.includes("success"))return"success";if(v.includes("warning"))return"pending";if(v.includes("error"))return"danger";if(v.includes("info"))return"review";return"default"};
      function render(){const items=api.getNotifications(user.id);const unread=items.filter(i=>!i.read).length;heroTitle.textContent=`Hello, ${user.fullName||"Student"}`;heroText.textContent=unread?`You have ${unread} unread Kagie notification${unread===1?"":"s"}.`:"You are fully caught up on Kagie updates.";unreadMeta.textContent=`${unread} unread`;totalMeta.textContent=`${items.length} total notifications`;const visible=items.filter(i=>active==="all"||active==="unread"&&!i.read||active==="read"&&i.read);list.innerHTML=visible.length?visible.map(i=>`<div class="item ${i.read?"":"unread"}"><div class="row"><div><span class="chip ${cls(i.type)}">${esc(i.type||"update")}</span></div><div style="color:#64748b;font-size:12px;font-weight:700">${esc(dt(i.createdAt))}</div></div><div style="margin-top:10px"><strong>${esc(i.title||"Notification")}</strong><p>${esc(i.message||"")}</p></div><div class="item-actions">${i.read?`<span class="mini" style="cursor:default">Read</span>`:`<button class="mini" data-read="${esc(i.id)}" type="button">Mark read</button>`}<a class="mini" href="${esc(route(i))}">Open</a></div></div>`).join(""):`<div class="empty">No notifications in this filter.</div>`}
      filters.forEach(btn=>btn.addEventListener("click",()=>{filters.forEach(b=>b.classList.remove("active"));btn.classList.add("active");active=btn.dataset.filter;render()}));document.getElementById("markAllBtn").addEventListener("click",()=>{api.markAllNotificationsRead(user.id);render()});list.addEventListener("click",e=>{const id=e.target.getAttribute("data-read");if(!id)return;api.markNotificationRead(id);render()});render()})();
  </script>
</body>
</html>
