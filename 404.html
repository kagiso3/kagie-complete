<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kagie | Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f4f7fb;--text:#0f172a;--muted:#64748b;--card:rgba(255,255,255,.88);--red:#c90000;--blue:#2fa4ff;--yellow:#f5c84c;--shadow:0 20px 44px rgba(15,23,42,.12)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:"Roboto",system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 520px at 15% 0%,rgba(47,164,255,.14),transparent 60%),radial-gradient(900px 560px at 85% 10%,rgba(245,200,76,.16),transparent 60%),var(--bg);display:grid;place-items:center}
    .card{width:min(560px,100%);padding:28px;border-radius:30px;background:var(--card);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow);text-align:center}
    .eyebrow{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(47,164,255,.1);color:var(--blue);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    h1{margin:16px 0 10px;font:800 34px "Poppins",sans-serif}
    p{margin:0;color:var(--muted);line-height:1.65}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:14px;text-decoration:none;font-weight:800}
    .primary{background:linear-gradient(135deg,var(--red),#a70000);color:#fff}
    .secondary{background:linear-gradient(135deg,var(--blue),#67caff);color:#fff}
  </style>
</head>
<body>
  <section class="card">
    <span class="eyebrow">Kagie</span>
    <h1>That page is not here.</h1>
    <p>The link may have changed while Kagie was being cleaned up for launch. Use the buttons below to continue with the live application flow.</p>
    <div class="actions">
      <a class="primary" href="index.html">Go to launch screen</a>
      <a class="secondary" href="login.html">Go to login</a>
    </div>
  </section>
</body>
</html>
